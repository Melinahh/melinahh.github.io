  <style>

    :root {

    html { scroll-behavior: smooth; }
    body { font-family: 'Raleway', sans-serif; background-color: var(--sable); color: var(--marron); min-height: 100vh; font-size: 16px; }

    nav {

      background: rgba(212,196,174,0.95); backdrop-filter: blur(10px);

      padding: 0 3rem; display: flex; align-items: center;

    .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--marron); letter-spacing: 0.05em; text-decoration: none; }
    .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }

    .dropdown { position: relative; }

    .dropdown-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 16px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--marron-mid); text-decoration: none; transition: background 0.15s, color 0.15s; }

    .h-corner-tr { position: absolute; top: 80px; right: 2rem; width: 28px; height: 28px; border-top: 2px solid rgba(122,52,66,0.4); border-right: 2px solid rgba(122,52,66,0.4); }
    .page-header p.tag { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ce3-light); margin-bottom: 0.8rem; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }

    .page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 5vw, 3.5rem); color: var(--sable); position: relative; z-index: 1; line-height: 1.2; }
    .header-line { width: 60px; height: 3px; background: var(--ce3); margin: 1.5rem auto 0; position: relative; z-index: 1; }

    .deco-wrap { position: relative; overflow: hidden; border-radius: 12px; }
    .deco-wrap::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(61,43,31,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(61,43,31,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    .deco-circle { position: absolute; border: 1px solid rgba(122,52,66,0.2); border-radius: 50%; pointer-events: none; z-index: 0; }
    .deco-diamond { position: absolute; background: rgba(122,52,66,0.3); transform: rotate(45deg); pointer-events: none; z-index: 0; }
    .corner-tl { position: absolute; top: 16px; left: 16px; width: 28px; height: 28px; border-top: 2px solid rgba(122,52,66,0.4); border-left: 2px solid rgba(122,52,66,0.4); pointer-events: none; z-index: 0; }
    .corner-br { position: absolute; bottom: 16px; right: 16px; width: 28px; height: 28px; border-bottom: 2px solid rgba(122,52,66,0.4); border-right: 2px solid rgba(122,52,66,0.4); pointer-events: none; z-index: 0; }
    .deco-inner { position: relative; z-index: 1; }

    .content { max-width: 1400px; margin: 0 auto; padding: 5rem 3rem 6rem; display: flex; flex-direction: column; gap: 3rem; }

    .section-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ce3); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
    .section-label::after { content: ''; flex: 1; height: 1px; background: rgba(122,52,66,0.25); }
    .section-title { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--marron); margin-bottom: 2rem; line-height: 1.2; }

    .sep { display: flex; align-items: center; gap: 1.5rem; }
    .sep-line { flex: 1; height: 1px; background: rgba(61,43,31,0.1); }
    .sep-diamond { width: 8px; height: 8px; background: var(--ce3); transform: rotate(45deg); }

    .comp-bloc { display: flex; align-items: center; gap: 2rem; background: var(--marron); border-radius: 14px; padding: 3rem; position: relative; overflow: hidden; }
